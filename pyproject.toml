[project]
name = "greenbank-ctf"
version = "0.1.0"
description = "MVP Green Bank Pipeline CTF educational competition"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bank_ctf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
